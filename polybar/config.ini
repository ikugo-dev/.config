[global/wm]
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
bottom = true
height = 28

background = ${color.background}
foreground = ${color.foreground}
overline-color = ${color.background}

font-0 = "Iosevka Nerd Font:size=10;4"
font-1 = "feather:size=10;3"
font-2 = Curved Square:style=Regular:size=22;1

modules-left = powermenu sep menu sep brightnessctl sep workspaces
modules-center = title
modules-right = network sep keyboard sep brightnessddcutil sep pipewire sep battery sep date sep

enable-ipc = true
